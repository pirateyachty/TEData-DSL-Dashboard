<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSL Accounts</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- iOS Home Screen Icon -->
    <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180x180.png">
    <!-- Android & General Purpose High-Res Icon -->
    <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512x512.png">
    <!-- Manifest (Optional, for better Android handling) -->
    <link rel="manifest" href="manifest.json">

    <style>
        body {
            font-family: 'Roboto', Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
            max-width: 700px;
            margin: auto;
            color: #444;
        }
        h1 {
            text-align: center;
            color: #3b5998;
            margin-bottom: 20px;
        }
        .sort-buttons {
            text-align: center;
            margin-bottom: 20px;
        }
        .sort-buttons button {
            padding: 8px 15px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background-color: #3b5998;
            color: white;
            font-size: 0.9em;
            transition: background-color 0.3s;
        }
        .sort-buttons button:hover {
            background-color: #2a4270;
        }
        .account {
            background: white;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            position: relative;
        }
        .account:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
        }
        .account h2 {
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #3b5998;
        }
        .account p {
            margin: 8px 0;
        }
        .progress-bar {
            width: 100%;
            height: 12px;
            background-color: #ddd;
            border-radius: 6px;
            overflow: hidden;
            margin-top: 8px;
            position: relative;
        }
        .progress {
            height: 100%;
            border-radius: 6px;
            transition: width 0.3s;
        }
        .progress.green { background-color: #4CAF50; }
        .progress.yellow { background-color: #FFC107; }
        .progress.red { background-color: #F44336; }
        .usage-text {
            text-align: right;
            font-size: 0.85em;
            color: #888;
            margin-top: 5px;
        }
        .usage-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 5px;
            font-size: 0.85em;
            color: #888;
        }
        .account-updated {
            text-align: left;
        }

        .expiry-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }
        .usage-pace {
            font-size: 0.9em;
            font-weight: 500;
            white-space: nowrap;
        }
        .usage-pace.on-pace {
            color: #6BA368;
        }
        .usage-pace.fast {
            color: #F44336;
        }
        .usage-pace.slow {
            color: #E69500;
        }
        .last-updated {
            text-align: center;
            margin-top: 20px;
            color: #888;
            font-size: 0.85em;
        }
    </style>
</head>
<body>
    <h1><i class="fa-solid fa-wifi"></i> DSL Accounts</h1>

    <div class="sort-buttons">
        <button id="sort-usage">Sort by Usage <i class="fa-solid fa-chart-line"></i></button>
        <button id="sort-expiry">Sort by Expiry Date <i class="fa-solid fa-calendar"></i></button>
    </div>

    <div id="accounts"></div>
    <div class="last-updated" id="last-updated"></div>

    <script>
        let accountsData = [];
        let currentSort = 'usage';
        const REFRESH_INTERVAL = 30000;

        async function fetchAndDisplayData() {
            try {
                const response = await fetch('/dsl_data.json?' + new Date().getTime());
                const data = await response.json();
                accountsData = data.accounts;
                const utcTime = data.timestamp;
                const localDate = new Date(utcTime);
                const localString = localDate.toLocaleString();
                document.getElementById('last-updated').textContent = `Last Run: ${localString}`;
                sortAndDisplay();
            } catch (error) {
                console.error("Error fetching data:", error);
            }
        }


        function parseWeDate(dateString) {
            if (!dateString) return null;

            const match = dateString.match(
                /(\d{2})\/(\d{2})\/(\d{4}) at (\d{2}):(\d{2}) (AM|PM)/
            );

            if (!match) return null;

            let [, day, month, year, hour, minute, ampm] = match;
            hour = parseInt(hour, 10);

            if (ampm === 'PM' && hour !== 12) hour += 12;
            if (ampm === 'AM' && hour === 12) hour = 0;

            // Use UTC here only as a timezone-neutral way to compare the
            // provider's renewal and expiration wall-clock dates.
            return new Date(Date.UTC(
                parseInt(year, 10),
                parseInt(month, 10) - 1,
                parseInt(day, 10),
                hour,
                parseInt(minute, 10)
            ));
        }

        function getUsagePace(account) {
            const usedGB = parseFloat(account.usedGB);
            const remainGB = parseFloat(account.remainGB);
            const daysUntilExp = parseFloat(account.daysUntilExp);
            const renewed = parseWeDate(account.renewedDate);
            const expires = parseWeDate(account.expDate);

            if (
                !Number.isFinite(usedGB) ||
                !Number.isFinite(remainGB) ||
                !Number.isFinite(daysUntilExp) ||
                !renewed ||
                !expires
            ) {
                return { text: 'On Pace', className: 'on-pace' };
            }

            const totalCycleDays = (expires - renewed) / (1000 * 60 * 60 * 24);
            const elapsedDays = totalCycleDays - daysUntilExp;

            if (elapsedDays <= 0 || usedGB <= 0) {
                return { text: 'On Pace', className: 'on-pace' };
            }

            const dailyUsage = usedGB / elapsedDays;
            const projectedDaysRemaining = remainGB / dailyUsage;

            // A projection within ±2 days of expiration counts as On Pace.
            if (Math.abs(projectedDaysRemaining - daysUntilExp) <= 2) {
                return { text: 'On Pace', className: 'on-pace' };
            }

            if (projectedDaysRemaining < daysUntilExp) {
                return {
                    text: `Using Fast · ~${Math.max(1, Math.round(projectedDaysRemaining))} days`,
                    className: 'fast'
                };
            }

            const projectedRemaining = Math.max(
                0,
                remainGB - (dailyUsage * daysUntilExp)
            );

            return {
                text: `Using Slow · ~${Math.round(projectedRemaining)} GB Unused`,
                className: 'slow'
            };
        }

        function sortAndDisplay() {
            if (currentSort === 'usage') {
                accountsData.sort((a, b) => parseFloat(b.usagePrc) - parseFloat(a.usagePrc));
            } else if (currentSort === 'expiry') {
                accountsData.sort((a, b) => parseInt(a.daysUntilExp) - parseInt(b.daysUntilExp));
            }

            const accountsDiv = document.getElementById('accounts');
            accountsDiv.innerHTML = "";

            accountsData.forEach(account => {
                const usagePrc = parseFloat(account.usagePrc);
                const lndNumber = account.lnd_number.substring(3);
                const accountTitle = account.ApartmentNumber || lndNumber;
                const pace = getUsagePace(account);

                let colorClass = 'green';
                if (usagePrc >= 75) colorClass = 'red';
                else if (usagePrc >= 50) colorClass = 'yellow';

                const accountDiv = document.createElement('div');
                accountDiv.className = 'account';
                accountDiv.innerHTML = `
                    <h2><i class="fa-solid fa-user"></i> <span class="account-title">${accountTitle}</span></h2>
                    <p><i class="fa-solid fa-gift"></i> Offer: ${account.offerName}</p>
                    <p class="expiry-info">
                        <span><i class="fa-solid fa-calendar-days"></i> Expires in ${account.daysUntilExp} days</span>
                        <span class="usage-pace ${pace.className}">${pace.text}</span>
                    </p>
                    <div class="progress-bar">
                        <div class="progress ${colorClass}" style="width: ${usagePrc}%;"></div>
                    </div>
                    <div class="usage-info">
                        <span class="account-updated">
                            Updated: ${account.lastUpdated
                            ? new Date(account.lastUpdated).toLocaleString()
                            : 'Unknown'}
                        </span>
                        <span>${usagePrc}% Used</span>
                    </div>
                `;

                accountDiv.addEventListener('click', () => {
                    const titleElement = accountDiv.querySelector('.account-title');
                    const originalText = titleElement.innerText;
                    
                    titleElement.innerText = `Account ${account.lnd_number}`;
                    
                    setTimeout(() => {
                        titleElement.innerText = originalText;
                    }, 3000);
                });

                accountsDiv.appendChild(accountDiv);
            });
        }

        document.getElementById('sort-usage').addEventListener('click', () => {
            currentSort = 'usage';
            sortAndDisplay();
        });

        document.getElementById('sort-expiry').addEventListener('click', () => {
            currentSort = 'expiry';
            sortAndDisplay();
        });

        fetchAndDisplayData();
        setInterval(fetchAndDisplayData, REFRESH_INTERVAL);
    </script>
</body>
</html>
